<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUFRI</title>

    <!--
      [체크리스트 7-03] 웹 보안 헤더.
      GitHub Pages 는 응답 헤더를 설정할 수 없어 meta 로 가능한 범위만 적용한다.
      frame-ancestors / HSTS / X-Content-Type-Options 는 meta 에서 동작하지 않는다.
      -> docs/security-checklist.md 의 갭 항목. 프록시 도입 여부 결정 필요.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-src https://login.microsoftonline.com;
               connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
